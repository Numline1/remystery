name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed to publish releases for version tags

jobs:
  windows:
    runs-on: windows-latest
    strategy:
      matrix:
        arch: [x64, arm64]
    steps:
      - uses: actions/checkout@v4
      - name: Build ReMystery.scr
        shell: pwsh
        run: ./windows/build.ps1 -Arch ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: ReMystery-windows-${{ matrix.arch }}
          path: build/ReMystery-${{ matrix.arch }}.scr

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build ReMystery.saver
        run: ./macos/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ReMystery-macOS
          path: build/ReMystery-macOS.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
