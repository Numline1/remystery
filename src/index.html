<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ReMystery</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;cursor:none;-webkit-user-select:none;user-select:none}
canvas{display:block;position:fixed;inset:0;width:100vw;height:100vh}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
/*
 * ReMystery: a high-resolution recreation of the Windows 98 "Mystery" screensaver.
 * All artwork is drawn procedurally and all audio is synthesized at runtime.
 * Layout and timing follow the original scene (see docs/ORIGINAL.md).
 *
 * URL parameters: ?sound=0 (mute) ?preview=1 (muted thumbnail) ?speed=N (time warp, for testing)
 *                 ?seed=N (fixed randomness)
 * Host API: window.reMystery.setMuted(bool), window.reMystery.stop()
 */
'use strict';
(() => {

// ---------------------------------------------------------------- setup ----
const Q = new URLSearchParams(window.__remysteryQuery || location.search);   // the Windows host injects its options
const PREVIEW = Q.get('preview') === '1';
const SPEED = Math.max(0.05, Number(Q.get('speed')) || 1);
const SEED = (Number(Q.get('seed')) || (Date.now() & 0xffffff)) >>> 0;
const DEBUG = Q.get('debug') || '';               // 'trees', 'sprites' or 'audio' (testing aids)
const START_AT = Math.max(0, Number(Q.get('at')) || 0);   // start the scene this many ms in
let muted = PREVIEW || Q.get('sound') === '0';

const TICK = 55;                    // the original engine's timer tick in ms
const REF_W = 1152, REF_H = 864;    // reference composition of the original scene

function rng(seed) {                // mulberry32
  let a = seed >>> 0;
  return () => {
    a = (a + 0x6D2B79F5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const rand = rng(SEED);
const rint = (lo, hi) => lo + Math.floor(rand() * (hi - lo + 1));
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
const lerp = (a, b, t) => a + (b - a) * t;

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d', { alpha: false });

// Scene metrics. One unit = one pixel of the original 1152x864 composition.
let W = 0, H = 0, S = 1, UW = REF_W, UH = REF_H;

function anchor(x, y, a) {          // anchors: 1 TL 2 TR 3 BR 4 BL 5 C 6 TC 7 RM 8 BC 9 LM
  if (a === 2 || a === 3 || a === 7) x = UW - x; else if (a === 5 || a === 6 || a === 8) x += UW / 2;
  if (a === 3 || a === 4 || a === 8) y = UH - y; else if (a === 5 || a === 7 || a === 9) y += UH / 2;
  return [x, y];
}

// ------------------------------------------------------------- drawing ----
function makeCanvas(w, h) {
  const c = document.createElement('canvas');
  c.width = Math.max(1, Math.ceil(w)); c.height = Math.max(1, Math.ceil(h));
  return c;
}
// Render a sprite of w x h units (plus padding) at the current scale.
function sprite(w, h, pad, draw) {
  const c = makeCanvas((w + 2 * pad) * S, (h + 2 * pad) * S);
  const g = c.getContext('2d');
  g.scale(S, S); g.translate(pad, pad);
  draw(g);
  c.pad = pad;
  return c;
}
function lin(g, x0, y0, x1, y1, stops) {
  const gr = g.createLinearGradient(x0, y0, x1, y1);
  for (const [o, c] of stops) gr.addColorStop(o, c);
  return gr;
}
function rad(g, x, y, r0, r1, stops, x1 = x, y1 = y) {
  const gr = g.createRadialGradient(x, y, r0, x1, y1, r1);
  for (const [o, c] of stops) gr.addColorStop(o, c);
  return gr;
}
function hex(c) { const n = parseInt(c.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
function rgba(c, a = 1, d = 0) { const [r, g, b] = hex(c); return `rgba(${clamp(r + d, 0, 255) | 0},${clamp(g + d, 0, 255) | 0},${clamp(b + d, 0, 255) | 0},${a})`; }
function poly(g, pts) { g.beginPath(); g.moveTo(pts[0][0], pts[0][1]); for (let i = 1; i < pts.length; i++) g.lineTo(pts[i][0], pts[i][1]); g.closePath(); }

// House coordinates: x from the screen centre, y = height above the bottom edge (up is positive).
// All house helpers take (x1, top, x2, bottom) in those coordinates and expect the context
// to be translated to (UW/2, UH).
const P = {
  trimHi: '#a7b1d6', trim: '#66739f', trimMid: '#58648f', trimLo: '#373f68', trimDeep: '#222846',
  slate: '#272b3a', slateHi: '#59627e', slateLo: '#12141c',
  glass: '#0e0e24', sash: '#5d5638',
  white: '#e6e7ef', whiteLo: '#a9acbd',
};
function fillR(g, x1, t, x2, b, style) { g.fillStyle = style; g.fillRect(x1, -t, x2 - x1, t - b); }
function vg(g, t, b, stops) { return lin(g, 0, -t, 0, -b, stops); }
function hg(g, x1, x2, stops) { return lin(g, x1, 0, x2, 0, stops); }

function siding(g, x1, t, x2, b, o = {}) {
  const step = o.step || 12, base = o.base || [178, 179, 194];
  const r = rng(Math.round(x1 * 31 + t * 17));
  g.save();
  g.beginPath(); g.rect(x1, -t, x2 - x1, t - b); g.clip();
  for (let y = Math.floor(b / step) * step; y < t; y += step) {
    const v = (r() - 0.5) * 7 + (o.tint || 0);
    const c = (k) => `rgb(${base[0] + k + v | 0},${base[1] + k + v | 0},${base[2] + k + v | 0})`;
    g.fillStyle = vg(g, y + step, y, [[0, c(-62)], [0.16, c(-14)], [0.55, c(4)], [0.92, c(14)], [1, c(22)]]);
    g.fillRect(x1, -(y + step), x2 - x1, step);
    g.fillStyle = 'rgba(30,30,48,0.55)';
    g.fillRect(x1, -(y + step), x2 - x1, 0.6);
  }
  // fine grain
  g.globalAlpha = 0.07;
  for (let i = 0; i < (x2 - x1) * (t - b) / 40; i++) {
    g.fillStyle = r() < 0.5 ? '#000' : '#fff';
    g.fillRect(x1 + r() * (x2 - x1), -(b + r() * (t - b)), 2 + r() * 6, 0.35);
  }
  g.restore();
}
function shade(g, x1, t, x2, b, dir, stops) {   // gradient overlay inside a rect
  g.fillStyle = dir === 'v' ? vg(g, t, b, stops) : hg(g, x1, x2, stops);
  g.fillRect(x1, -t, x2 - x1, t - b);
}
// Fish-scale slate shingles clipped to a polygon (house coords).
function shingles(g, pts, o = {}) {
  const sw = o.w || 10, rh = o.h || 7.5;
  const xs = pts.map(p => p[0]), ys = pts.map(p => p[1]);
  const x1 = Math.min(...xs) - sw, x2 = Math.max(...xs) + sw, top = Math.max(...ys), bot = Math.min(...ys);
  const r = rng(Math.round(x1 * 13 + top * 7));
  g.save();
  poly(g, pts.map(([x, y]) => [x, -y])); g.clip();
  g.fillStyle = P.slateLo; g.fillRect(x1, -top - 2, x2 - x1, top - bot + 4);
  const rows = [];
  for (let y = top + rh, row = 0; y > bot - rh; y -= rh, row++) rows.push([y, row]);
  rows.reverse();                                  // lower rows first, upper rows overlap them
  for (const [y, row] of rows) {
    const off = (row % 2) * sw / 2;
    for (let x = x1 + off; x < x2; x += sw) {
      const v = (r() - 0.5) * 16;
      const cy = -(y - rh * 0.9);
      g.beginPath();
      g.moveTo(x, -y - 2);
      g.lineTo(x, cy);
      g.arc(x + sw / 2, cy, sw / 2, Math.PI, 0, true);
      g.lineTo(x + sw, -y - 2);
      g.closePath();
      g.fillStyle = lin(g, 0, -y, 0, cy + sw / 2, [[0, rgba('#20232f', 1, v)], [0.6, rgba('#2f3445', 1, v)], [1, rgba('#3f4659', 1, v)]]);
      g.fill();
      g.beginPath();
      g.arc(x + sw / 2, cy, sw / 2 - 0.4, Math.PI * 0.95, Math.PI * 0.05, true);
      g.strokeStyle = `rgba(150,162,200,${0.18 + r() * 0.12})`;
      g.lineWidth = 0.7;
      g.stroke();
    }
  }
  // moonlit sheen near the top, darker towards the eaves
  g.fillStyle = lin(g, 0, -top, 0, -bot, [[0, 'rgba(150,160,205,0.22)'], [0.5, 'rgba(60,70,110,0.05)'], [1, 'rgba(0,0,0,0.35)']]);
  g.fillRect(x1, -top, x2 - x1, top - bot);
  g.restore();
}
// Projecting moulding: light cap, shadowed cove, fascia, dark drip edge.
function cornice(g, x1, x2, t, h, o = {}) {
  const y = -t, cap = h * 0.22, cove = h * 0.3, fas = h * 0.3, drip = h - cap - cove - fas;
  const ret = o.ret ?? 2;                          // inset of the lower parts (gives a flare)
  g.fillStyle = lin(g, 0, y, 0, y + cap, [[0, P.trimHi], [1, '#8591bd']]);
  g.fillRect(x1, y, x2 - x1, cap);
  g.fillStyle = lin(g, 0, y + cap, 0, y + cap + cove, [[0, P.trimDeep], [0.5, P.trimLo], [1, P.trim]]);
  g.fillRect(x1 + ret * 0.5, y + cap, x2 - x1 - ret, cove);
  g.fillStyle = lin(g, 0, y + cap + cove, 0, y + cap + cove + fas, [[0, '#7a87b6'], [1, P.trimMid]]);
  g.fillRect(x1 + ret, y + cap + cove, x2 - x1 - 2 * ret, fas);
  g.fillStyle = P.trimDeep;
  g.fillRect(x1 + ret, y + h - drip, x2 - x1 - 2 * ret, drip);
  if (o.shadow !== false) {                        // soft shadow cast on the wall below
    g.fillStyle = lin(g, 0, y + h, 0, y + h + (o.shadowLen || 14), [[0, 'rgba(5,5,18,0.55)'], [1, 'rgba(5,5,18,0)']]);
    g.fillRect(x1 + ret, y + h, x2 - x1 - 2 * ret, o.shadowLen || 14);
  }
  // end returns
  g.fillStyle = 'rgba(10,12,30,0.35)';
  g.fillRect(x1, y, 1.2, h * 0.55); g.fillRect(x2 - 1.2, y, 1.2, h * 0.55);
}

// --------------------------------------------------------------- windows --
// A window is described by its glass rectangle (house coords) and its pane grid.
function paneRects(x1, t, x2, b, cols, rows, m) {
  const out = [], pw = (x2 - x1 - m * (cols - 1)) / cols, ph = (t - b - m * (rows - 1)) / rows;
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
    const px = x1 + c * (pw + m), pt = t - r * (ph + m);
    out.push([px, pt, px + pw, pt - ph]);
  }
  return out;
}
function archPath(g, x1, t, x2, b) {             // rectangle with a semicircular top
  const r = (x2 - x1) / 2;
  g.beginPath();
  g.moveTo(x1, -b); g.lineTo(x1, -(t - r));
  g.arc(x1 + r, -(t - r), r, Math.PI, 0);
  g.lineTo(x2, -b); g.closePath();
}
function darkGlass(g, x1, t, x2, b) {
  g.fillStyle = lin(g, x1, -t, x2, -b, [[0, '#1b1c3c'], [0.45, P.glass], [1, '#0a0a1a']]);
  g.fill();
}
function litGlass(g, x1, t, x2, b, k = 1) {
  g.fillStyle = rad(g, (x1 + x2) / 2, -(t + b) / 2 + (t - b) * 0.1, 0, Math.max(x2 - x1, t - b) * 0.75,
    [[0, '#fff6b8'], [0.45, '#ffdc55'], [1, '#f2a92a']]);
  g.fill();
  // drapes at the sides
  const w = x2 - x1;
  g.save(); g.clip();
  for (const [sx, d] of [[x1, 1], [x2, -1]]) {
    g.fillStyle = lin(g, sx, 0, sx + d * w * 0.22 * k, 0, [[0, 'rgba(150,70,10,0.55)'], [1, 'rgba(150,70,10,0)']]);
    g.fillRect(Math.min(sx, sx + d * w * 0.22 * k), -t, w * 0.22 * k, t - b);
  }
  g.restore();
}
function windowFrame(g, gl, o = {}) {
  const [x1, t, x2, b] = gl, f = o.frame ?? 5.5;
  const cols = o.cols || 2, rows = o.rows || 2, m = o.mullion ?? 2.4;
  // drop shadow on the siding + sill
  g.fillStyle = 'rgba(8,8,20,0.45)';
  g.fillRect(x1 - f + 1.5, -(t + f) + 2, x2 - x1 + 2 * f, t - b + 2 * f);
  if (o.arch) archPath(g, x1 - f, t + f, x2 + f, b - f); else { g.beginPath(); g.rect(x1 - f, -(t + f), x2 - x1 + 2 * f, t - b + 2 * f); }
  g.fillStyle = lin(g, x1 - f, -(t + f), x2 + f, -(b - f), [[0, '#8794c2'], [0.4, P.trim], [1, P.trimLo]]);
  g.fill();
  // inner bevel
  g.strokeStyle = 'rgba(15,18,45,0.7)'; g.lineWidth = 0.8;
  if (o.arch) archPath(g, x1 - 0.6, t + 0.6, x2 + 0.6, b - 0.6); else { g.beginPath(); g.rect(x1 - 0.6, -(t + 0.6), x2 - x1 + 1.2, t - b + 1.2); }
  g.stroke();
  // sill
  g.fillStyle = lin(g, 0, -(b - f), 0, -(b - f - 3), [[0, '#98a3cf'], [1, P.trimLo]]);
  g.fillRect(x1 - f - 2, -(b - f), x2 - x1 + 2 * f + 4, 3);
  glass(g, gl, o, false);
}
function glass(g, gl, o, lit) {
  const [x1, t, x2, b] = gl, cols = o.cols || 2, rows = o.rows || 2, m = o.mullion ?? 2.4;
  if (o.arch) {
    archPath(g, x1, t, x2, b);
    lit ? litGlass(g, x1, t, x2, b, 0.6) : darkGlass(g, x1, t, x2, b);
    // transom bar + sash outline
    const ty = b + (t - b) * (o.transom ?? 0.45);
    g.fillStyle = lit ? '#9a6a1c' : P.trim;
    g.fillRect(x1, -ty - m / 2, x2 - x1, m);
    archPath(g, x1 + 0.4, t - 0.4, x2 - 0.4, b + 0.4);
    g.strokeStyle = lit ? 'rgba(140,90,20,0.8)' : 'rgba(110,100,60,0.55)'; g.lineWidth = 0.6; g.stroke();
    return;
  }
  for (const [px1, pt, px2, pb] of paneRects(x1, t, x2, b, cols, rows, m)) {
    g.beginPath(); g.rect(px1, -pt, px2 - px1, pt - pb);
    if (lit) litGlass(g, x1, t, x2, b, 1); else darkGlass(g, px1, pt, px2, pb);
    g.strokeStyle = lit ? 'rgba(150,95,20,0.75)' : 'rgba(110,100,60,0.5)'; g.lineWidth = 0.6;
    g.strokeRect(px1 + 0.3, -pt + 0.3, px2 - px1 - 0.6, pt - pb - 0.6);
  }
  if (!lit) {                                      // mullions
    g.fillStyle = P.trim;
    const pw = (x2 - x1 - m * (cols - 1)) / cols, ph = (t - b - m * (rows - 1)) / rows;
    for (let c = 1; c < cols; c++) g.fillRect(x1 + c * pw + (c - 1) * m, -t, m, t - b);
    for (let r = 1; r < rows; r++) g.fillRect(x1, -(t - r * ph - (r - 1) * m), x2 - x1, m);
  }
}

// Window table (glass rectangles in house coordinates). Lit overlays reuse the same geometry.
const WIN = {
  upperL: { gl: [-168, 320, -109, 270] },
  upperR: { gl: [106, 321, 165, 271] },
  wingL:  { gl: [-306, 188, -247, 138] },
  wingR:  { gl: [249, 188, 308, 138] },
  lowerR: { gl: [86, 191, 183, 111], cols: 3, rows: 1, mullion: 3 },
  lowerL: { gl: [-188, 191, -89, 109], cols: 3, rows: 1, mullion: 3 },
  dormL:  { gl: [-142, 421, -114, 376], arch: true, transom: 0.42 },
  dormR:  { gl: [109, 422, 137, 377], arch: true, transom: 0.42 },
  tower:  { gl: [-34, 315, 31, 260] },
  centre: { gl: [-25, 452, 21, 365], arch: true, transom: 0.5, frame: 6 },
};

// ------------------------------------------------------------------ house --
function drawHouse(g) {
  // --- wings ---------------------------------------------------------------
  for (const s of [-1, 1]) {
    const xo = s < 0 ? -347 : 201, xi = s < 0 ? -206 : 346;
    const wx1 = Math.min(xo, xi), wx2 = Math.max(xo, xi);
    siding(g, wx1, 228, wx2, 96, { step: s < 0 ? 11 : 12 });
    shade(g, wx1, 228, wx2, 96, 'h', s < 0
      ? [[0, 'rgba(10,10,30,0.35)'], [0.15, 'rgba(10,10,30,0)'], [0.85, 'rgba(10,10,30,0)'], [1, 'rgba(10,10,30,0.4)']]
      : [[0, 'rgba(10,10,30,0.45)'], [0.15, 'rgba(10,10,30,0)'], [0.85, 'rgba(10,10,30,0)'], [1, 'rgba(10,10,30,0.3)']]);
    shade(g, wx1, 120, wx2, 96, 'v', [[0, 'rgba(0,0,0,0)'], [1, 'rgba(0,0,0,0.45)']]);
    // hip roof
    const ex1 = s < 0 ? -362 : 205, ex2 = s < 0 ? -205 : 362;
    const rTop = 285, rBot = 242;
    const pts = s < 0
      ? [[-348, rBot], [-318, rTop], [-207, rTop], [-207, rBot]]
      : [[207, rBot], [207, rTop], [318, rTop], [348, rBot]];
    shingles(g, pts);
    cornice(g, s < 0 ? -322 : 204, s < 0 ? -204 : 322, 297, 12, { shadow: false, ret: 1 });
    cornice(g, ex1, ex2, 244, 18, { shadowLen: 18 });
  }
  // --- main block walls -----------------------------------------------------
  siding(g, -210, 352, -70, 80);
  siding(g, 66, 352, 208, 80);
  shade(g, -210, 352, -70, 80, 'h', [[0, 'rgba(10,10,30,0.35)'], [0.12, 'rgba(10,10,30,0)'], [0.78, 'rgba(10,10,30,0)'], [1, 'rgba(10,10,35,0.55)']]);
  shade(g, 66, 352, 208, 80, 'h', [[0, 'rgba(10,10,35,0.6)'], [0.22, 'rgba(10,10,30,0)'], [0.88, 'rgba(10,10,30,0)'], [1, 'rgba(10,10,30,0.35)']]);
  shade(g, -210, 110, 208, 80, 'v', [[0, 'rgba(0,0,0,0)'], [1, 'rgba(0,0,0,0.5)']]);
  // --- windows in the walls -------------------------------------------------
  for (const k of ['wingL', 'wingR', 'upperL', 'upperR', 'lowerL', 'lowerR']) windowFrame(g, WIN[k].gl, WIN[k]);
  // --- mansard roof ---------------------------------------------------------
  shingles(g, [[-207, 369], [-174, 456], [168, 456], [201, 369]]);
  cornice(g, -191, 185, 471, 15, { shadow: false, ret: 1.5 });
  // side dormers
  for (const [k, cx] of [['dormL', -128], ['dormR', 123]]) {
    const gl = WIN[k].gl;
    // dormer cheeks
    shingles(g, [[cx - 36, 369], [cx - 33, 432], [cx + 33, 432], [cx + 36, 369]], { w: 8, h: 6 });
    // white clapboard face
    g.save();
    siding(g, cx - 29, 434, cx + 29, 369, { step: 6, base: [214, 216, 228] });
    shade(g, cx - 29, 434, cx + 29, 369, 'h', [[0, 'rgba(20,20,45,0.25)'], [0.2, 'rgba(0,0,0,0)'], [0.8, 'rgba(0,0,0,0)'], [1, 'rgba(20,20,45,0.35)']]);
    g.restore();
    windowFrame(g, gl, WIN[k]);
    // segmental arch hood on top of the surround
    hood(g, cx, 31, 428, 14, 7);
    shade(g, cx - 29, 423, cx + 29, 410, 'v', [[0, 'rgba(5,5,20,0.4)'], [1, 'rgba(5,5,20,0)']]);
  }
  // main eave
  cornice(g, -226, 220, 369, 19, { shadowLen: 22 });
  // --- centre tower ---------------------------------------------------------
  siding(g, -72, 332, 67, 46);
  shade(g, -72, 332, 67, 46, 'h', [[0, 'rgba(10,10,30,0.4)'], [0.12, 'rgba(10,10,30,0)'], [0.85, 'rgba(10,10,30,0)'], [1, 'rgba(10,10,30,0.5)']]);
  windowFrame(g, WIN.tower.gl, WIN.tower);
  // shadow under the window and above the porch hood
  g.fillStyle = rad(g, -3, -238, 4, 48, [[0, 'rgba(20,20,35,0.6)'], [1, 'rgba(20,20,35,0)']]);
  g.fillRect(-72, -290, 139, 80);
  // door recess, lit by the porch lamp
  g.save();
  g.beginPath(); g.moveTo(-38, -92); g.lineTo(-38, -210); g.quadraticCurveTo(-3.5, -232, 31, -210); g.lineTo(31, -92); g.closePath();
  g.fillStyle = lin(g, 0, -228, 0, -92, [[0, '#f4f4fa'], [0.15, '#c8c9d6'], [0.6, '#8d8ea0'], [1, '#5c5d6c']]);
  g.fill();
  g.clip();
  g.fillStyle = rad(g, -3.5, -222, 0, 40, [[0, 'rgba(255,255,240,0.95)'], [0.3, 'rgba(255,250,230,0.4)'], [1, 'rgba(255,250,230,0)']]);
  g.fillRect(-40, -235, 75, 60);
  // pilaster strips beside the door
  for (const px of [-38, 24]) {
    g.fillStyle = hg(g, px, px + 7, [[0, '#4b4c5a'], [0.5, '#6e6f80'], [1, '#3c3d4a']]);
    g.fillRect(px, -200, 7, 108);
    for (let y = 100; y < 200; y += 9) { g.fillStyle = 'rgba(20,20,30,0.6)'; g.fillRect(px, -y, 7, 0.8); }
  }
  g.restore();
  // porch hood: segmental arch on a flat band
  g.save();
  g.beginPath();
  g.moveTo(-46, -214); g.quadraticCurveTo(-3.5, -248, 39, -214); g.lineTo(31, -214); g.quadraticCurveTo(-3.5, -235, -38, -214); g.closePath();

function drawGround(g) {                          // screen units

// Each tree is rendered into its own canvas, just big enough for its branches.
function buildTrees() {
  return ['left', 'right'].map((key) => {
    const def = TREES[key], [bx, by, ba] = def.box;
    const [ox, oy] = anchor(bx, by, ba);
    const segs = growTree(def, ox, oy);
    let x1 = Infinity, y1 = Infinity, x2 = -Infinity, y2 = -Infinity;
    for (const pts of segs) for (const [x, y, w] of pts) {
      x1 = Math.min(x1, x - w); y1 = Math.min(y1, y - w); x2 = Math.max(x2, x + w); y2 = Math.max(y2, y + w);
    }
    x1 = Math.max(x1 - 4, -40); y1 = Math.max(y1 - 4, -40); x2 = Math.min(x2 + 4, UW + 40); y2 = Math.min(y2 + 4, UH + 40);

    for (const set of ['door', 'study', 'owl', 'batA', 'batB', 'cat', 'moon']) {
      for (const img of [].concat(SPR[set])) {
        if (x + img.width > W) { x = 8; y += rowH + 8; rowH = 0; }
        ctx.drawImage(img, x, y); x += img.width + 8; rowH = Math.max(rowH, img.height);
      }
      x = 8; y += rowH + 8; rowH = 0;
    }
    return;
  }
  for (const o of objs) {
    const d = o.d;
    if (d.kind === 'trees') { for (const t of treeLayers) blit(t, t.x, t.y); continue; }
    if (d.kind === 'house') { blit(houseLayer, 0, UH - HOUSE_BAND); continue; }
    if (!o.visible) continue;
    let x = o.x, y = o.y;
    if (d.smooth && o.t1 > o.t0) {                 // glide between the original's discrete steps
      const u = clamp((now - o.t0) / (o.t1 - o.t0), 0, 1);
      x = lerp(o.px, o.x, u); y = lerp(o.py, o.y, u);
    }
    switch (d.kind) {
      case 'star': if (o.frame === 0) blit(SPR.star, x, y); break;
      case 'moon': blit(SPR.moon, x, y, true); break;
      case 'win': if (o.frame === 1) { const g = WIN[d.win].gl; blit(SPR['lit_' + d.win], UW / 2 + g[0], UH - g[1]); } break;
      case 'door': blit(SPR.door[o.frame], x, y); break;
      case 'study': if (o.frame > 0) blit(SPR.study[o.frame], x, y); break;
      case 'cat': blit(SPR.cat[o.frame], x, y, true); break;
      case 'owl': blit(SPR.owl[o.frame], x, y); break;
      case 'batA': blit(SPR.batA[o.frame], x, y, true); break;
      case 'batB': blit(SPR.batB[o.frame], x, y, true); break;
    }
  }
}

// -------------------------------------------------------------------- main --
let clock = 0, lastReal = performance.now(), lastDraw = -1e9, running = true, resizeTimer = 0;
function loop(real) {
  if (!running) return;
  requestAnimationFrame(loop);
  const dt = Math.min(250, Math.max(0, real - lastReal));
  lastReal = real;
  clock += dt * SPEED;
  update(clock);
  if (real - lastDraw >= 31) { lastDraw = real; draw(clock); }
}
function rebuild() {
  // keep animation state, re-anchor positions for the new screen size
  const oldUW = UW, oldUH = UH;
  buildScene();
  for (const o of objs) {
    if (o.d.x === undefined) continue;
    if (o.d.smooth) {                              // movers keep their place relative to the anchor edges
      const dx = UW - oldUW, dy = UH - oldUH, a = o.d.a;
      const fx = (a === 2 || a === 3 || a === 7) ? dx : (a === 5 || a === 6 || a === 8) ? dx / 2 : 0;
      const fy = (a === 3 || a === 4 || a === 8) ? dy : (a === 5 || a === 7 || a === 9) ? dy / 2 : 0;
      o.x += fx; o.px += fx; o.y += fy; o.py += fy;
    } else {
      const [x, y] = anchor(o.d.x, o.d.y, o.d.a); o.x = o.px = x; o.y = o.py = y;
    }
  }
  draw(clock);
}
window.addEventListener('resize', () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(rebuild, 150); });

if (DEBUG === 'audio') {                           // dump the synthesized sounds as WAV (for testing)
  const wav = (chans, sr) => {
    const n = chans[0].length, nc = chans.length, buf = new DataView(new ArrayBuffer(44 + n * nc * 2));
    const str = (o, t) => { for (let i = 0; i < t.length; i++) buf.setUint8(o + i, t.charCodeAt(i)); };
    str(0, 'RIFF'); buf.setUint32(4, 36 + n * nc * 2, true); str(8, 'WAVEfmt '); buf.setUint32(16, 16, true);
    buf.setUint16(20, 1, true); buf.setUint16(22, nc, true); buf.setUint32(24, sr, true); buf.setUint32(28, sr * nc * 2, true);
    buf.setUint16(32, nc * 2, true); buf.setUint16(34, 16, true); str(36, 'data'); buf.setUint32(40, n * nc * 2, true);
    for (let i = 0; i < n; i++) for (let c = 0; c < nc; c++) buf.setInt16(44 + (i * nc + c) * 2, clamp(chans[c][i], -1, 1) * 32767, true);
    let bin = ''; const u = new Uint8Array(buf.buffer);
    for (let i = 0; i < u.length; i += 0x8000) bin += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000));
    return btoa(bin);
  };
  const sr = 44100, put = (k, b64) => { const e = document.createElement('pre'); e.id = 'wav-' + k; e.textContent = b64; document.body.appendChild(e); };
  put('creak', wav([synthCreak(sr)], sr)); put('owl', wav([synthOwl(sr)], sr)); put('howl', wav([synthHowl(sr)], sr));
  synthOrgan(sr).then((b) => { put('organ', wav([b.getChannelData(0), b.getChannelData(1)], sr)); document.title = 'audio-done'; });
  return;
}
buildScene();
resetObjects(clock);
for (; clock < START_AT; clock = Math.min(START_AT, clock + TICK)) update(clock);
if (!muted) initAudio();                          // previews and muted screens never start audio
draw(clock);
requestAnimationFrame(loop);

// Windows host: any input ends the screensaver (macOS handles this itself).
const host = window.chrome && window.chrome.webview;
if (host && !PREVIEW) {
  let origin = null;
  const quit = () => host.postMessage('exit');
  window.addEventListener('mousemove', (e) => {
    if (!origin) { origin = [e.screenX, e.screenY]; return; }
    if (Math.abs(e.screenX - origin[0]) + Math.abs(e.screenY - origin[1]) > 12) quit();
  });
  for (const ev of ['mousedown', 'keydown', 'wheel', 'touchstart']) window.addEventListener(ev, quit, { passive: true });
}
// Browsers may block audio until a gesture; resume on the first interaction.
for (const ev of ['pointerdown', 'keydown']) window.addEventListener(ev, () => audio.ctx && audio.ctx.resume().catch(() => {}), { passive: true });

window.reMystery = {
  setMuted(m) { muted = !!m; if (!muted) initAudio(); if (audio.master) audio.master.gain.value = muted ? 0 : 0.9; },
  stop() { running = false; if (audio.ctx) audio.ctx.close().catch(() => {}); },
  play,
  state: () => ({ clock: Math.round(clock), audio: audio.ctx ? audio.ctx.state : 'none', sounds: Object.keys(audio.buf).length, muted, objs: objs.filter((o) => o.d.steps).map((o) => `${o.d.id}:${o.mode}:${o.si}:${o.frame}:${o.visible ? 'v' : 'h'}:${Math.round(o.x || 0)},${Math.round(o.y || 0)}`) }),
};
})();
</script>
